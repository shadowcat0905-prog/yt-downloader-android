name: Compilar APK Android
on: [push, workflow_dispatch]

jobs:
  build:
      runs-on: ubuntu-latest
          steps:
                - uses: actions/checkout@v4
                      - uses: actions/setup-python@v5
                              with:
                                        python-version: '3.10'
                                              - name: Instalar dependencias
                                                      run: |
                                                                sudo apt-get update
                                                                          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git unzip zip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi7
                                                                                    pip install --upgrade pip buildozer cython
                                                                                          - name: Compilar APK
                                                                                                  run: buildozer android debug
                                                                                                        - name: Subir artefacto APK
                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                        with:
                                                                                                                                  name: app-release-apk
                                                                                                                                            path: bin/*.apk
