name: Compilar APK Android (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias de Sistema (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Renombrar main_android.py a main.py para Buildozer
        run: |
          cp main_android.py main.py

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v3
        with:
          name: YouTubeDownloader-APK
          path: bin/*.apk
